name = "dottie"
main = "src/index.ts"
compatibility_date = "2024-09-23"

# Secrets (set with `npx wrangler secret put <NAME>`):
#   ANTHROPIC_API_KEY  - Claude (talker's requests, text asks)
#   ZAI_API_KEY        - GLM (screen steps, pointing, helpers)
#   JEV_API_KEY        - Jev (/jev)
#   APP_SHARED_SECRET  - optional; must match ClickyAppSharedSecret in Info.plist
#   GROQ_API_KEY       - optional; free key from https://console.groq.com/keys.
#                        The talker, and a backup when Claude and GLM can't answer.
#   NVIDIA_API_KEY     - optional; free key from https://build.nvidia.com. NIM
#                        models answer when everything else is busy.
#   TELEGRAM_BOT_TOKEN - optional; Dottie's own Telegram bot (made once with
#                        @BotFather). People then pair their phone in one tap
#                        from Home → Phone instead of making a bot themselves.

# Phone pairing (phoneRelay.ts): each Mac's mailbox and the pairing codes.
# SQLite-backed Durable Objects work on the free Workers plan.
[[durable_objects.bindings]]
name = "PHONE_RELAY"
class_name = "PhoneRelay"

[[migrations]]
tag = "v1-phone-relay"
new_sqlite_classes = ["PhoneRelay"]

# Limits per install (usageLimits.ts): each copy of the app's counts for the
# day, and how many new copies were seen today.
[[durable_objects.bindings]]
name = "INSTALL_USAGE"
class_name = "InstallUsage"

[[migrations]]
tag = "v2-install-usage"
new_sqlite_classes = ["InstallUsage"]

# Most requests one address may make a minute (the app's own bursts, like a
# screen job's steps, stay well under it). Counted at Cloudflare's edge with
# no extra wait. namespace_id is any number unique in the account.
[[ratelimits]]
name = "REQUEST_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 300, period = 60 }

# Workers Logs: keeps each answer's "[usage]" line (provider, model,
# tokens, seconds, estimated $) in the dashboard, not only in wrangler tail.
[observability]
enabled = true

[vars]
# Groq models (only with GROQ_API_KEY), best first. Each has its own free
# limit (about 30 requests and 8,000 tokens a minute).
GROQ_TEXT_MODELS = "openai/gpt-oss-120b,openai/gpt-oss-20b,qwen/qwen3.8-27b"
GROQ_VISION_MODELS = "qwen/qwen3.8-27b"
# Biggest request sent to Groq, in tokens. 7000 fits the free plan's 8,000 a
# minute; raise it on a paid plan so long screen jobs and Dot turns fit too.
GROQ_MAX_REQUEST_TOKENS = "7000"
# What one install may ask for in a day, per area, and how many installs the
# Worker has never seen may start in a day. "voice" counts live sessions,
# "chat" questions and screen-job steps, "helpers" a helper's model calls.
# Add UNLIMITED_INSTALL_IDS (comma-separated; each Mac's id is under
# Settings → Updates in the app) for Macs that should never be limited.
INSTALL_DAILY_LIMITS = "voice=300,chat=3000,speech=1000,dictation=1000,helpers=3000,search=1000,newInstalls=200"
# NVIDIA NIM backups (only with NVIDIA_API_KEY), best first.
NIM_MODELS = "z-ai/glm-5.3-flash,deepseek-ai/deepseek-v4.1-flash"
# Seconds one model may take on a screen-job step before the next provider
# answers. The app waits about 20 s; Claude is the only one asked by default.
SCREEN_STEP_ATTEMPT_SECONDS = "15"
# Newest screenshots sent with each screen step (older ones become a note).
SCREEN_STEP_SCREENSHOTS = "2"
# Dollars per million tokens, input/output, for each answer's estimated
# cost ("model=in/out,..."). Claude Haiku 5.5 is built in; add GLM, Groq
# and NIM from their consoles. Models without a price show the cost as unknown.
MODEL_PRICES = ""

name: Diagnose Worker
on:
  push:
    branches: [diagnose-worker]
jobs:
  dots:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      W: https://dottie.vidershub.workers.dev
    steps:
      - name: Install the Dots runtime like Dottie does
        run: |
          set -e
          R=$HOME/rt; mkdir -p $R; cd $R
          curl -sSLO https://nodejs.org/dist/v24.22.0/node-v24.22.0-darwin-arm64.tar.gz
          shasum -a 256 node-v24.22.0-darwin-arm64.tar.gz
          tar -xzf node-v24.22.0-darwin-arm64.tar.gz
          curl -sSLO https://registry.npmjs.org/@google/gemini-cli/-/gemini-cli-0.64.0.tgz
          mkdir g && tar -xzf gemini-cli-0.64.0.tgz -C g
          printf '#!/bin/sh\nexec "%s" "%s" "$@"\n' "$R/node-v24.22.0-darwin-arm64/bin/node" "$R/g/package/bundle/gemini.js" > gemini; chmod +x gemini
          ./gemini --version
      - name: CLI home like prepareCLIHome
        run: |
          H=$HOME/clihome/.gemini; mkdir -p $H
          cat > $H/settings.json <<'J'
          {"security":{"auth":{"selectedType":"gemini-api-key"}},"context":{"fileName":"AGENTS.md"},"tools":{"exclude":["google_web_search"]}}
          J
          mkdir -p $HOME/ws/output $HOME/ws/tmp $HOME/ws/.gemini
          printf '{"context":{"fileName":"AGENTS.md"},"model":{"name":"gemini-3.6-flash"}}' > $HOME/ws/.gemini/settings.json
          printf '# Helper\nYou are Helper, a background helper. Put anything you make in output/. Finish the job before you reply.\n' > $HOME/ws/AGENTS.md
      - name: Turn 1 - build a website
        run: |
          cd $HOME/ws
          export GOOGLE_GEMINI_BASE_URL=$W/gemini GEMINI_API_KEY=clicky-worker GEMINI_CLI_HOME=$HOME/clihome NO_COLOR=1
          start=$(date +%s)
          $HOME/rt/gemini -m gemini-3.6-flash -p "Build me a simple one-page website for a coffee shop called Bean There, with a menu and opening hours. Put it in output/site." -o stream-json --approval-mode yolo --skip-trust --session-id 11111111-2222-4333-8444-555555555555 < /dev/null > t1.jsonl 2> t1.err; echo "exit $? after $(( $(date +%s)-start ))s"
          cut -c1-300 t1.jsonl | head -60; echo ---stderr; tail -c 1500 t1.err
          find output -type f | head; wc -c output/site/* 2>/dev/null || true
      - name: Turn 2 - resume
        run: |
          cd $HOME/ws
          export GOOGLE_GEMINI_BASE_URL=$W/gemini GEMINI_API_KEY=clicky-worker GEMINI_CLI_HOME=$HOME/clihome NO_COLOR=1
          $HOME/rt/gemini -m gemini-3.6-flash -p "What did you just build? One sentence." -o stream-json --approval-mode yolo --skip-trust --resume 11111111-2222-4333-8444-555555555555 < /dev/null > t2.jsonl 2> t2.err; echo "exit $?"
          cut -c1-300 t2.jsonl | tail -8; echo ---stderr; tail -c 800 t2.err
      - name: Include directories outside the workspace
        run: |
          cd $HOME/ws; mkdir -p $HOME/Desktop $HOME/Documents; echo "hello from desktop" > $HOME/Desktop/note.txt
          export GOOGLE_GEMINI_BASE_URL=$W/gemini GEMINI_API_KEY=clicky-worker GEMINI_CLI_HOME=$HOME/clihome NO_COLOR=1
          $HOME/rt/gemini -m gemini-3.6-flash -p "Read ~/Desktop/note.txt with your file tool and tell me what it says." -o stream-json --approval-mode yolo --skip-trust --include-directories $HOME/Desktop --include-directories $HOME/Documents --session-id 21111111-2222-4333-8444-555555555555 < /dev/null > t3.jsonl 2> t3.err; echo "exit $?"
          cut -c1-300 t3.jsonl | tail -8; tail -c 600 t3.err

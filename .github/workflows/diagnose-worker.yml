name: Diagnose Worker
on:
  push:
    branches: [diagnose-worker]
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      W: https://dottie.vidershub.workers.dev
    steps:
      - name: Make test inputs
        run: |
          screencapture -x shot.png || true
          ls -la shot.png || true
          sips -Z 1280 -s format jpeg shot.png --out shot.jpg >/dev/null 2>&1 || true
          ls -la shot.jpg || true
          say -o speech.aiff "Okay team, quick update. Sam will send the budget by Friday. Priya is fixing the login bug today. Let's meet again on Tuesday at ten."
          afconvert -f WAVE -d LEI16@16000 -c 1 speech.aiff speech.wav
          ls -la speech.wav
      - name: Probe speed and audio
        run: |
          cat > probe.py <<'PY'
          import json, time, base64, os, urllib.request
          W = os.environ["W"]
          def chat(body):
              t = time.time()
              req = urllib.request.Request(W + "/chat", data=json.dumps(body).encode(), headers={"Content-Type": "application/json"})
              try:
                  raw = urllib.request.urlopen(req, timeout=120).read().decode()
              except Exception as e:
                  return time.time() - t, "ERROR " + str(getattr(e, "code", "")) + " " + (e.read().decode()[:200] if hasattr(e, "read") else str(e))
              text = ""
              for line in raw.splitlines():
                  if line.startswith("data:"):
                      try:
                          d = json.loads(line[5:])
                          for p in d["candidates"][0]["content"]["parts"]:
                              if not p.get("thought") and "text" in p:
                                  text += p["text"]
                      except Exception:
                          pass
              return time.time() - t, text.strip()
          img = base64.b64encode(open("shot.jpg", "rb").read()).decode() if os.path.exists("shot.jpg") else None
          def box_body(model, level):
              parts = []
              if img: parts.append({"inlineData": {"mimeType": "image/jpeg", "data": img}})
              parts.append({"text": "Return JSON {\"box_2d\":[ymin,xmin,ymax,xmax]} (0-1000) for the Apple menu icon at the top left."})
              gc = {"responseMimeType": "application/json"}
              if level: gc["thinkingConfig"] = {"thinkingLevel": level}
              return {"model": model, "contents": [{"role": "user", "parts": parts}], "generationConfig": gc}
          for model, level in [("gemini-3.6-flash", None), ("gemini-3.6-flash", "low"), ("gemini-3.8-flash", None), ("gemini-3.8-flash", "low"), ("gemini-3.5-flash-lite", None), ("gemini-3.5-flash", "low")]:
              for i in range(3):
                  dt, out = chat(box_body(model, level))
                  print(f"BOX {model} thinking={level} run{i}: {dt:.1f}s -> {out[:120]}")
          q = "In two short sentences, why is the sky blue?"
          for model, level in [("gemini-3.8-flash", None), ("gemini-3.8-flash", "low"), ("gemini-3.6-flash", "low"), ("gemini-3.5-flash-lite", None)]:
              for i in range(2):
                  gc = {"thinkingConfig": {"thinkingLevel": level}} if level else {}
                  dt, out = chat({"model": model, "contents": [{"role": "user", "parts": [{"text": q}]}], "generationConfig": gc})
                  print(f"TEXT {model} thinking={level} run{i}: {dt:.1f}s -> {out[:100]}")
          wav = base64.b64encode(open("speech.wav", "rb").read()).decode()
          for model in ["gemini-3.5-flash-lite", "gemini-3.6-flash"]:
              dt, out = chat({"model": model, "contents": [{"role": "user", "parts": [{"inlineData": {"mimeType": "audio/wav", "data": wav}}, {"text": "Transcribe this meeting audio word for word. Plain text only."}]}]})
              print(f"AUDIO {model}: {dt:.1f}s -> {out[:300]}")
          PY
          python3 probe.py
      - name: Mac tools present
        run: |
          which shortcuts osascript || true
          shortcuts list 2>&1 | head -5 || true
          osascript -e 'return (current date) as string' || true

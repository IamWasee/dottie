name: Diagnose Worker
on:
  push:
    branches: [diagnose-worker]
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      W: https://dottie.vidershub.workers.dev
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Draw a fake speed dial
        run: |
          pip install -q pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          W,H=1440,936
          im=Image.new("RGB",(W,H),(70,90,120)); d=ImageDraw.Draw(im)
          try: f=ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf",18)
          except: f=ImageFont.load_default()
          d.rectangle([0,0,W,60],fill=(30,30,35)); d.text((20,20),"Speed Dial   |   Enter search or web address",fill="white",font=f)
          d.rectangle([465,150,1000,190],fill=(40,50,70)); d.text((480,160),"Search the web",fill=(200,200,200),font=f)
          names=["twitch.tv","airbnb","warships","belmont","booking.com","pinterest.com","gx games","eneba","doom","youtube.com","harvard","youtube","aniwatch","animesuge","instagram","physics","catflix.su","facebook.com"]
          boxes={}
          for i,n in enumerate(names):
            r,c=divmod(i,6); x=325+c*138; y=230+r*91
            d.rectangle([x,y,x+121,y+74],fill=(90,120,160)); d.text((x+10,y+28),n,fill="white",font=f)
            boxes[n]=(x,y,x+121,y+74)
          im.save("dial.jpg",quality=85)
          b=boxes["pinterest.com"]; print("pinterest box px",b,"center norm",round((b[0]+b[2])/2/W*1000),round((b[1]+b[3])/2/H*1000))
          b=boxes["facebook.com"]; print("facebook box px",b,"center norm",round((b[0]+b[2])/2/W*1000),round((b[1]+b[3])/2/H*1000))
          PY
      - name: Two-step loop with function response plus new screenshot
        run: |
          cat > loop.mjs <<'JS'
          import fs from "fs";
          const img = fs.readFileSync("dial.jpg").toString("base64");
          const tools = [{ functionDeclarations: [
            { name: "click", description: "Click an element on the screenshot.", parameters: { type: "object", properties: {
              box_2d: { type: "array", items: { type: "integer" }, description: "[ymin, xmin, ymax, xmax] of the element, 0-1000" },
              label: { type: "string" } }, required: ["box_2d", "label"] } },
            { name: "type_text", description: "Type text into the focused field.", parameters: { type: "object", properties: { text: { type: "string" }, press_enter: { type: "boolean" } }, required: ["text"] } },
            { name: "finish", description: "The task is done; answer is what to tell the user.", parameters: { type: "object", properties: { answer: { type: "string" } }, required: ["answer"] } } ] }];
          const [model, level] = process.argv.slice(2);
          const gen = level ? { thinkingConfig: { thinkingLevel: level } } : {};
          const contents = [{ role: "user", parts: [{ inlineData: { mimeType: "image/jpeg", data: img } }, { text: "Task: search the web for kaggle, then tell me which bookmark is right of booking.com. Take the next step." }] }];
          for (let step = 1; step <= 3; step++) {
            const t0 = Date.now();
            const r = await fetch(process.env.W + "/chat", { method: "POST", headers: { "content-type": "application/json" },
              body: JSON.stringify({ model, contents, tools, toolConfig: { functionCallingConfig: { mode: "ANY" } }, generationConfig: gen }) });
            const txt = await r.text();
            if (r.status !== 200) { console.log(model, level, "step", step, r.status, txt.slice(0, 400)); break; }
            const parts = [];
            for (const line of txt.split("\n")) if (line.startsWith("data: ")) { const e = JSON.parse(line.slice(6)); for (const p of e.candidates?.[0]?.content?.parts ?? []) parts.push(p); }
            const calls = parts.filter(p => p.functionCall);
            console.log(model, level, "step", step, Date.now() - t0 + "ms", JSON.stringify(calls.map(p => p.functionCall)), "sig:", calls.some(p => p.thoughtSignature));
            if (!calls.length || calls[0].functionCall.name === "finish") break;
            contents.push({ role: "model", parts });
            contents.push({ role: "user", parts: [
              ...calls.map(p => ({ functionResponse: { name: p.functionCall.name, ...(p.functionCall.id ? { id: p.functionCall.id } : {}), response: { result: "done" } } })),
              { inlineData: { mimeType: "image/jpeg", data: img } },
              { text: "Here is the screen now. Take the next step." } ] });
          }
          JS
          for m in gemini-3.6-flash gemini-3.5-flash; do node loop.mjs $m; done
          node loop.mjs gemini-3.6-flash low || true
          node loop.mjs gemini-3.6-flash minimal || true

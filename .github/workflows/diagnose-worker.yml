name: Diagnose Worker
on:
  push:
    branches: [diagnose-worker]
jobs:
  dots:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      W: https://dottie.vidershub.workers.dev
    steps:
      - name: Install the Dots runtime like Dottie does
        run: |
          set -e
          R=$HOME/rt; mkdir -p $R; cd $R
          curl -sSLO https://nodejs.org/dist/v24.22.0/node-v24.22.0-darwin-arm64.tar.gz
          shasum -a 256 node-v24.22.0-darwin-arm64.tar.gz
          tar -xzf node-v24.22.0-darwin-arm64.tar.gz
          curl -sSLO https://registry.npmjs.org/@google/gemini-cli/-/gemini-cli-0.64.0.tgz
          mkdir g && tar -xzf gemini-cli-0.64.0.tgz -C g
          printf '#!/bin/sh\nexec "%s" "%s" "$@"\n' "$R/node-v24.22.0-darwin-arm64/bin/node" "$R/g/package/bundle/gemini.js" > gemini; chmod +x gemini
          ./gemini --version
      - name: CLI home like prepareCLIHome
        run: |
          H=$HOME/clihome/.gemini; mkdir -p $H
          cat > $H/settings.json <<'J'
          {"security":{"auth":{"selectedType":"gemini-api-key"}},"context":{"fileName":"AGENTS.md"},"tools":{"exclude":["google_web_search"]}}
          J
          mkdir -p $HOME/ws/output $HOME/ws/tmp $HOME/ws/.gemini
          printf '{"context":{"fileName":"AGENTS.md"},"model":{"name":"gemini-3.6-flash"}}' > $HOME/ws/.gemini/settings.json
          printf '# Helper\nYou are Helper, a background helper. Put anything you make in output/. Finish the job before you reply.\n' > $HOME/ws/AGENTS.md
      - name: Brain - memory, shared folder and an MCP server
        run: |
          B="$HOME/Library/Application Support/Dottie/Brain"; mkdir -p "$B" $HOME/Projects/site $HOME/brainws/output
          printf '%s\n' '{"id":"1","date":"2026-10-15T14:00:00Z","kind":"chat","text":"user: im redesigning my portfolio site in figma, its called NovaFolio\ndottie: nice"}' '{"id":"2","date":"2026-10-15T16:00:00Z","kind":"screen","text":"Editing hero section of NovaFolio in Figma"}' > "$B/journal.jsonl"
          printf -- '- Name: Sam\n- Working on: NovaFolio portfolio\n' > "$B/profile.md"
          echo "TODO: fix the contact form" > $HOME/Projects/site/notes.txt
          cat > $HOME/clihome/.gemini/settings.json <<'J'
          {"security":{"auth":{"selectedType":"gemini-api-key"}},"context":{"fileName":"AGENTS.md"},"tools":{"exclude":["google_web_search"]},
           "mcpServers":{"everything":{"command":"'"$HOME"'/rt/node-v24.22.0-darwin-arm64/bin/npx","args":["-y","@modelcontextprotocol/server-everything"],"env":{"PATH":"'"$HOME"'/rt/node-v24.22.0-darwin-arm64/bin:/usr/bin:/bin"}}}}
          J
          printf '# Brain\nYou are Dottie'"'"'s second brain. Memory folder: %s (journal.jsonl, profile.md). Answer in two sentences.\n' "$B" > $HOME/brainws/AGENTS.md
          cd $HOME/brainws
          export GOOGLE_GEMINI_BASE_URL=$W/gemini GEMINI_API_KEY=clicky-worker GEMINI_CLI_HOME=$HOME/clihome NO_COLOR=1 PATH=$HOME/rt/node-v24.22.0-darwin-arm64/bin:$PATH
          $HOME/rt/gemini -m gemini-3.6-flash -p "Dottie's question for you: what was I working on yesterday, and what's left to do in my site project folder? Also use the everything MCP server's echo tool to echo the word hello." -o stream-json --approval-mode yolo --skip-trust --include-directories "$B" --include-directories $HOME/Projects/site --session-id 31111111-2222-4333-8444-555555555555 < /dev/null > b.jsonl 2> b.err; echo "exit $?"
          grep -o '"tool_name":"[^"]*"' b.jsonl | sort | uniq -c
          grep '"role":"assistant"' b.jsonl | sed 's/.*"content":"\([^"]*\)".*/\1/' | tr -d '\n'; echo
          grep '"type":"result"' b.jsonl | cut -c1-200; grep -i "mcp\|everything" b.err | head -5

name: Diagnose Worker
on:
  push:
    branches: [diagnose-worker]
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      W: https://dottie.vidershub.workers.dev
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Concurrent Live sessions
        run: |
          cat > live.mjs <<'JS'
          const W = process.env.W;
          const [model, count, label] = [process.argv[2], Number(process.argv[3]), process.argv[4]];
          async function one(i) {
            const t = await (await fetch(W + "/live-token", { method: "POST" })).json();
            if (!t.token) return `#${i} no token ${JSON.stringify(t).slice(0,200)}`;
            const ws = new WebSocket("wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContentConstrained?access_token=" + encodeURIComponent(t.token));
            return await new Promise((resolve) => {
              const timer = setTimeout(() => { resolve(`#${i} timeout`); try { ws.close(); } catch {} }, 25000);
              let said = "";
              ws.onopen = () => ws.send(JSON.stringify({ setup: { model: "models/" + model, generationConfig: { responseModalities: ["AUDIO"] }, realtimeInputConfig: { automaticActivityDetection: { disabled: true } }, outputAudioTranscription: {} } }));
              ws.onmessage = async (e) => {
                const s = typeof e.data === "string" ? e.data : Buffer.from(await e.data.arrayBuffer()).toString();
                const m = JSON.parse(s);
                if (m.setupComplete) {
                  ws.send(JSON.stringify({ realtimeInput: { activityStart: {} } }));
                  ws.send(JSON.stringify({ realtimeInput: { text: "Say hi in three words." } }));
                  ws.send(JSON.stringify({ realtimeInput: { activityEnd: {} } }));
                }
                if (m.serverContent?.outputTranscription?.text) said += m.serverContent.outputTranscription.text;
                // Hold the session open a few seconds so they overlap.
                if (m.serverContent?.turnComplete) setTimeout(() => { clearTimeout(timer); resolve(`#${i} ok: ${said.trim()}`); ws.close(); }, 4000);
              };
              ws.onclose = (e) => { clearTimeout(timer); resolve(`#${i} close ${e.code} ${e.reason.slice(0,90)}`); };
            });
          }
          const results = await Promise.all(Array.from({ length: count }, (_, i) => one(i)));
          console.log(`== ${label} ${model} x${count}\n` + results.join("\n"));
          JS
          sed -i 's/realtimeInputConfig: { automaticActivityDetection: { disabled: true } }, outputAudioTranscription: {} /outputAudioTranscription: {} /' live.mjs
          for m in gemini-3.8-live gemini-3.1-flash-live-preview gemini-2.5-flash-native-audio-latest gemini-3.8-live-extended-thinking; do node live.mjs $m 1 minimal; done
          curl -sS -X POST $W/live-token | sed -E 's/"token":"[^"]+"/"token":"<redacted>"/'
      - name: Daily quota per model
        run: |
          for m in gemini-3.8-flash gemini-3.7-flash gemini-3.6-flash gemini-3.5-flash gemini-3.5-flash-lite gemini-flash-latest gemini-flash-lite-latest gemini-3.1-flash-lite; do
            code=$(curl -sS -o out.txt -w '%{http_code}' -X POST -H 'x-goog-api-key: x' -H 'content-type: application/json' \
              "$W/gemini/v1beta/models/$m:generateContent" -d '{"contents":[{"role":"user","parts":[{"text":"Say hi."}]}]}')
            echo "$m -> $code $(tr -d '\n' < out.txt | grep -oE '"message": *"[^"]{0,140}' | head -1)"
          done

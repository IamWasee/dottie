name: Diagnose Worker
# Temporary: runs the voice-web-search Worker locally and tries /search.
on:
  push:
    branches: [diagnose-worker]
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: voice-web-search
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Search through a local Worker
        working-directory: worker
        run: |
          npm ci --silent
          (npx wrangler dev --port 8787 > dev.log 2>&1 &)
          for i in $(seq 1 60); do curl -s localhost:8787/health >/dev/null && break; sleep 1; done
          for q in "bbc news today" "weather in London" "latest swift version" "price of bitcoin" "who won the world series"; do
            echo "== $q"
            curl -sS -G --data-urlencode "q=$q" localhost:8787/search | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);console.log("source",j.source,"results",(j.results||[]).length);for(const r of (j.results||[]).slice(0,3))console.log(" -",r.title,"|",r.url,"|",r.snippet.slice(0,90));console.log(" top:",j.topPage?j.topPage.url+" "+j.topPage.text.length+" chars: "+j.topPage.text.slice(0,200):"none")})'
          done
          tail -5 dev.log

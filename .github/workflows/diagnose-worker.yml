name: Diagnose Worker
on:
  push:
    branches: [diagnose-worker]
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      W: https://dottie.vidershub.workers.dev
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Push-to-talk with automatic detection
        run: |
          curl -sS -X POST -H 'content-type: application/json' $W/tts -d '{"text":"What is the capital of France? Answer briefly."}' -o speech24.pcm
          ls -la speech24.pcm
          cat > ptt.mjs <<'JS'
          import fs from "fs";
          const W = process.env.W;
          const [model, label, cfgJSON, trailingSilenceMs, extraText] = process.argv.slice(2);
          const pcm24 = fs.readFileSync("speech24.pcm");
          const in24 = new Int16Array(pcm24.buffer, pcm24.byteOffset, pcm24.length >> 1);
          const n16 = Math.floor(in24.length * 2 / 3); const s16 = new Int16Array(n16);
          for (let i = 0; i < n16; i++) { const x = i * 1.5, a = Math.floor(x), f = x - a; s16[i] = in24[a] * (1 - f) + (in24[a + 1] ?? 0) * f; }
          const speech = Buffer.from(s16.buffer);
          const silence = Buffer.alloc(Number(trailingSilenceMs) * 32);
          const audio = Buffer.concat([speech, silence]);
          const t = await (await fetch(W + "/live-token", { method: "POST" })).json();
          const ws = new WebSocket("wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContentConstrained?access_token=" + encodeURIComponent(t.token));
          const t0 = Date.now(); let tEnd = 0; const log = []; let heard = "", said = ""; let firstOut = 0, turns = 0;
          const stamp = (m) => log.push(`${Date.now() - t0}ms ${m}`);
          const sleep = (ms) => new Promise(r => setTimeout(r, ms));
          const done = new Promise((resolve) => {
            ws.onopen = () => ws.send(JSON.stringify({ setup: { model: "models/" + model, generationConfig: { responseModalities: ["AUDIO"] }, systemInstruction: { parts: [{ text: process.env.SYS || "You are a helpful voice assistant." }] }, inputAudioTranscription: {}, outputAudioTranscription: {}, ...JSON.parse(cfgJSON) } }));
            ws.onmessage = async (e) => {
              const m = JSON.parse(typeof e.data === "string" ? e.data : Buffer.from(await e.data.arrayBuffer()).toString());
              if (m.setupComplete) {
                stamp("setup ok");
                for (let i = 0; i < audio.length; i += 3200) { ws.send(JSON.stringify({ realtimeInput: { audio: { mimeType: "audio/pcm;rate=16000", data: audio.subarray(i, i + 3200).toString("base64") } } })); await sleep(100); }
                tEnd = Date.now(); stamp("released");
                if (extraText) ws.send(JSON.stringify({ realtimeInput: { text: extraText } }));
                ws.send(JSON.stringify({ realtimeInput: { audioStreamEnd: true } }));
              }
              const sc = m.serverContent || {};
              if (sc.inputTranscription?.text) heard += sc.inputTranscription.text;
              if (sc.outputTranscription?.text) { if (!firstOut) { firstOut = Date.now(); stamp(`first output (${tEnd ? (firstOut - tEnd) + "ms after release" : "BEFORE release"})`); } said += sc.outputTranscription.text; }
              if (sc.interrupted) stamp("interrupted");
              if (sc.turnComplete) { turns++; stamp("turnComplete"); }
            };
            ws.onclose = (e) => { stamp(`close ${e.code} ${e.reason.slice(0, 80)}`); resolve(); };
            setTimeout(() => { ws.close(); resolve(); }, 30000);
          });
          await done;
          console.log(`== ${label} ${model}\nheard: ${heard.trim()}\nsaid: ${said.trim().slice(0, 160)}\nturns: ${turns}\n` + log.join("\n"));
          process.exit(0);
          JS
          T='{"realtimeInputConfig":{"automaticActivityDetection":{"silenceDurationMs":1200,"endOfSpeechSensitivity":"END_SENSITIVITY_LOW"}}}'
          L='{"realtimeInputConfig":{"automaticActivityDetection":{"silenceDurationMs":60000,"endOfSpeechSensitivity":"END_SENSITIVITY_LOW"}}}'
          node ptt.mjs gemini-3.8-live ptt-quick-release "$T" 200 ""
          node ptt.mjs gemini-3.8-live ptt-held-3s "$T" 3000 ""
          node ptt.mjs gemini-3.8-live ptt-long-silence-config "$L" 200 ""
          node ptt.mjs gemini-3.8-live ptt-with-context-text "$L" 200 "(The screenshot shows one screen.)"
          SYS="Only listen. Never reply." node ptt.mjs gemini-3.8-live dictation-long-silence "$L" 4000 ""
          node ptt.mjs gemini-3.1-flash-live-preview ptt-quick-release "$T" 200 ""

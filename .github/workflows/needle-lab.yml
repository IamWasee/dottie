name: Needle lab

# Runs Dottie's own Needle code (DottieNeedleEngine and DottieNeedleToolsets)
# against the real engine on a Mac with everyday asks, and prints the
# checksums scripts/embed-needle.sh pins. Run it by hand (Actions → Needle
# lab) after changing the toolsets or bumping the Needle version.
on:
  pull_request:
    paths: ["scripts/needle-lab/**", "scripts/embed-needle.sh", "leanring-buddy/DottieNeedle*.swift", ".github/workflows/needle-lab.yml"]
  workflow_dispatch:
    inputs:
      files:
        description: "pinned (what Dottie ships) or latest (Hugging Face main, before bumping the pins)"
        default: pinned

permissions:
  contents: read

jobs:
  lab:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      NEEDLE_TELEMETRY: "0"
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch Needle
        env:
          # Passed as a variable so typed text is never run as a command.
          NEEDLE_FILES: ${{ inputs.files || 'pinned' }}
        run: scripts/needle-lab/fetch.sh "$RUNNER_TEMP/needle" "$NEEDLE_FILES"
      - name: Build the lab
        run: |
          swiftc -O -o "$RUNNER_TEMP/needle-lab" scripts/needle-lab/main.swift leanring-buddy/DottieNeedleEngine.swift leanring-buddy/DottieNeedleToolsets.swift
      - name: Make speech clips
        run: |
          mkdir -p "$RUNNER_TEMP/clips"
          i=0
          while IFS= read -r line; do
            i=$((i+1))
            say -o "$RUNNER_TEMP/clips/$i.wav" --data-format=LEI16@16000 "$line"
          done <<'LINES'
          open safari
          could you put chrome on the left side
          turn the volume down a bit
          remind me tomorrow at 7 pm to call mom
          what's the weather like in Lagos and should I bring an umbrella today
          LINES
      - name: Run the lab
        run: |
          sysctl -n machdep.cpu.brand_string
          "$RUNNER_TEMP/needle-lab" "$RUNNER_TEMP/needle" "$RUNNER_TEMP"/clips/*.wav

name: Release

# Builds Dottie.dmg and publishes it as a GitHub Release, so people can
# download Dottie like any other Mac app:
#   https://github.com/<owner>/<repo>/releases/latest/download/Dottie.dmg
#
# Run it from the Actions tab ("Release" → "Run workflow"), or push a tag
# like v1.0.1. See INSTALL.md for the one-time setup.
#
# Repository secrets it uses:
#   GEMINI_API_KEY         your key from https://aistudio.google.com/apikey
#   CLOUDFLARE_API_TOKEN   lets this workflow deploy the Worker (the small
#                          server that keeps the Gemini key out of the app)
#   CLOUDFLARE_ACCOUNT_ID  optional; only if the token reaches several accounts
#   DOTTIE_APP_SECRET      optional; any long random string. The Worker then
#                          only answers copies of Dottie built with it.
#   GROQ_API_KEY           optional; free key from https://console.groq.com/keys.
#                          Live meeting help and quick asks answer on Groq.
#   TELEGRAM_BOT_TOKEN     optional; Dottie's own Telegram bot (make it once
#                          with @BotFather). Home → Phone then pairs a phone
#                          in one tap.
#   DOTTIE_RELEASES_TOKEN  needed with DOTTIE_RELEASES_REPOSITORY below: a
#                          fine-grained token with Contents read and write on
#                          that releases repository only.
# Repository variables it uses:
#   DOTTIE_WORKER_URL      when the Worker isn't deployed here: its address,
#                          e.g. https://dottie.you.workers.dev
#   DOTTIE_RELEASES_REPOSITORY  optional, like IamWasee/dottie-releases: a
#                          public repository the DMG is published to, so the
#                          code can stay private while people still download
#                          and update Dottie. Without it, releases go here.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (leave empty for the one after the newest release)"
        required: false
        default: ""
      release_without_green_build:
        description: "Emergency only: release even when the Build workflow isn't green for this commit"
        type: boolean
        required: false
        default: false
  push:
    tags: ["v*"]
  # A trial run on pull requests that touch the release: builds the DMG and
  # keeps it as a build artifact, without deploying or publishing anything.
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "scripts/**"

# Read-only unless a job asks for more: only "publish" may write.
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

# The order matters. Nothing people use changes until everything that can
# fail has passed:
#   1. prepare        checks the Worker's tests, that the Build workflow is
#                     green for this commit, picks the version and finds the
#                     Worker's address (without deploying)
#   2. build-dmg      builds, signs and checks Dottie.dmg
#   3. deploy-worker  only now puts the new Worker live, tries it, and goes
#                     back to the one before if it doesn't answer properly
#   4. publish        publishes the release
# A pull request runs 1 and 2 only, as a trial.
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      checks: read
    env:
      RELEASES_REPOSITORY: ${{ vars.DOTTIE_RELEASES_REPOSITORY || github.repository }}
    outputs:
      worker_url: ${{ steps.address.outputs.worker_url }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # wrangler 4 needs Node 22.
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Check the Worker
        # A Worker that fails its type check or tests is never deployed.
        working-directory: worker
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: The Build workflow must be green for this commit
        # The Build workflow compiles the app and runs its unit tests on
        # every push to main. A release of a commit it didn't pass (or never
        # saw) stops here. If Build is still running, this waits for it.
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_WITHOUT_GREEN_BUILD: ${{ inputs.release_without_green_build }}
        run: |
          if [ "$RELEASE_WITHOUT_GREEN_BUILD" = "true" ]; then
            echo "::warning::Releasing without checking the Build workflow, as asked."
            exit 0
          fi
          # Up to 30 minutes: a Mac build takes about 10.
          for attempt in $(seq 1 60); do
            build_check="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=build-macos" \
              --jq '.check_runs | sort_by(.started_at) | last | "\(.status) \(.conclusion)"' || true)"
            case "$build_check" in
              "completed success")
                echo "Build is green for $GITHUB_SHA."
                exit 0
                ;;
              completed*)
                echo "::error::The Build workflow ended with \"${build_check#completed }\" for this commit. Fix it (or re-run it) before releasing."
                exit 1
                ;;
              "null null"|"")
                if [ "$attempt" -ge 4 ]; then
                  echo "::error::The Build workflow never ran for commit $GITHUB_SHA. Release from main after its Build finished, or run Build on this commit first (Actions → Build → Run workflow)."
                  exit 1
                fi
                ;;
            esac
            echo "Build is \"$build_check\" for this commit, waiting…"
            sleep 30
          done
          echo "::error::Build didn't finish in 30 minutes."
          exit 1

      - name: Pick the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASES_TOKEN: ${{ secrets.DOTTIE_RELEASES_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          # The newest version published in a repository, or nothing.
          newest_release_version() {
            gh api "repos/$1/releases?per_page=30" --jq '.[].tag_name' 2>/dev/null \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -V | tail -1
          }
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          elif [ -n "$INPUT_VERSION" ]; then
            version="${INPUT_VERSION#v}"
          else
            # One after the newest release, wherever it was published, so
            # versions go 1.0.72, 1.0.73, … and never jump with the number
            # of workflow runs.
            newest_version="$(newest_release_version "$GITHUB_REPOSITORY")"
            if [ "$RELEASES_REPOSITORY" != "$GITHUB_REPOSITORY" ]; then
              releases_repository_version="$(GH_TOKEN="${RELEASES_TOKEN:-$GH_TOKEN}" newest_release_version "$RELEASES_REPOSITORY")"
              newest_version="$(printf '%s\n%s\n' "$newest_version" "$releases_repository_version" | grep . | sort -V | tail -1 || true)"
            fi
            if [ -n "$newest_version" ]; then
              version="${newest_version%.*}.$(( ${newest_version##*.} + 1 ))"
            else
              version="1.0.0"
            fi
            echo "Newest release: ${newest_version:-none}"
          fi
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::\"$version\" isn't a version like 1.2.3."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version $version"
          echo "### Dottie $version" >> "$GITHUB_STEP_SUMMARY"

      - name: Find the Worker address
        # The app is built with the Worker's address inside, and it is built
        # before the Worker is deployed, so the address is looked up here:
        # the DOTTIE_WORKER_URL variable, or else Cloudflare is asked for the
        # account's workers.dev name (a read, nothing is deployed).
        id: address
        env:
          CONFIGURED_URL: ${{ vars.DOTTIE_WORKER_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          worker_url="${CONFIGURED_URL%/}"
          if [ -z "$worker_url" ] && [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            cloudflare_api="https://api.cloudflare.com/client/v4"
            account_id="$CLOUDFLARE_ACCOUNT_ID"
            if [ -z "$account_id" ]; then
              account_id="$(curl -fsS --max-time 20 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$cloudflare_api/accounts" | jq -r '.result[0].id // empty' || true)"
            fi
            if [ -n "$account_id" ]; then
              workers_subdomain="$(curl -fsS --max-time 20 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$cloudflare_api/accounts/$account_id/workers/subdomain" | jq -r '.result.subdomain // empty' || true)"
            fi
            worker_name="$(grep -E '^name *= *' worker/wrangler.toml | head -1 | sed -E 's/^name *= *"([^"]+)".*/\1/')"
            if [ -n "${workers_subdomain:-}" ] && [ -n "$worker_name" ]; then
              worker_url="https://$worker_name.$workers_subdomain.workers.dev"
            fi
          fi
          if [ -n "$worker_url" ]; then
            echo "Worker: $worker_url"
          elif [ -n "$CLOUDFLARE_API_TOKEN" ] && [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "::error::Couldn't find the Worker's address before deploying. Set the DOTTIE_WORKER_URL repository variable to it (like https://dottie.yourname.workers.dev) and run the release again. Nothing was deployed or published."
            exit 1
          else
            echo "::warning::No Worker address. Add the GEMINI_API_KEY and CLOUDFLARE_API_TOKEN secrets (see INSTALL.md), or set the DOTTIE_WORKER_URL variable. Dottie will ask for the address in Settings."
          fi
          # Trial builds are public artifacts and never carry the address.
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            worker_url=""
          fi
          echo "worker_url=$worker_url" >> "$GITHUB_OUTPUT"

  build-dmg:
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 40
    env:
      # Where downloads and in-app updates come from: the public releases
      # repository when one is set, otherwise this one.
      RELEASES_REPOSITORY: ${{ vars.DOTTIE_RELEASES_REPOSITORY || github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Pick Xcode
        # The newest Xcode 26 on the runner, so Dottie can use Apple's
        # on-device model on Macs that have it. Falls back to the default.
        # The build keeps Xcode 16's concurrency rules (the two SWIFT_
        # settings in "Build Dottie.app"), which Dottie was always built with.
        run: |
          xcode="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' | sort -V | tail -1)"
          if [ -n "$xcode" ]; then
            sudo xcode-select -s "$xcode/Contents/Developer"
          else
            echo "::warning::No Xcode 26 on this runner: building with the default Xcode."
          fi
          xcodebuild -version

      - name: Put the Worker address in the app
        # Trial builds are public artifacts, so they never carry the secret.
        if: github.event_name != 'pull_request'
        env:
          WORKER_URL: ${{ needs.prepare.outputs.worker_url }}
          DOTTIE_APP_SECRET: ${{ secrets.DOTTIE_APP_SECRET }}
        run: |
          plist=leanring-buddy/Info.plist
          if [ -n "$WORKER_URL" ]; then
            /usr/libexec/PlistBuddy -c "Set :ClickyWorkerBaseURL $WORKER_URL" "$plist"
          fi
          if [ -n "$DOTTIE_APP_SECRET" ]; then
            /usr/libexec/PlistBuddy -c "Set :ClickyAppSharedSecret $DOTTIE_APP_SECRET" "$plist"
          fi
          # In-app updates read the releases repository's releases.
          /usr/libexec/PlistBuddy -c "Set :DottieUpdateRepository $RELEASES_REPOSITORY" "$plist"

      - name: Build Dottie.app
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -o pipefail
          # "Sign to Run Locally" (ad-hoc): no Apple Developer account
          # needed. macOS asks people to allow it once (see INSTALL.md).
          xcodebuild build \
            -project leanring-buddy.xcodeproj \
            -scheme leanring-buddy \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ENABLE_HARDENED_RUNTIME=NO \
            SWIFT_DEFAULT_ACTOR_ISOLATION=nonisolated \
            SWIFT_APPROACHABLE_CONCURRENCY=NO \
            2>&1 | tee build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)|cua-driver|Permission denied|Command .* failed" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Sign with Dottie's own certificate
        # macOS remembers what you allowed by the app's signing identity. An
        # ad-hoc build gets a new one every time, so every update asked for
        # permissions again. Signing every release with the same certificate
        # (repository secrets DOTTIE_SIGNING_P12, base64 of a .p12, and
        # DOTTIE_SIGNING_PASSWORD) keeps them. Without the secrets the build
        # stays ad-hoc. Trial runs sign too, so this step is tested before a
        # release depends on it.
        env:
          SIGNING_P12: ${{ secrets.DOTTIE_SIGNING_P12 }}
          SIGNING_PASSWORD: ${{ secrets.DOTTIE_SIGNING_PASSWORD }}
        run: |
          if [ -z "$SIGNING_P12" ]; then
            echo "No DOTTIE_SIGNING_P12 secret: keeping the ad-hoc signature."
            exit 0
          fi
          app=build/Build/Products/Release/Dottie.app
          keychain="$RUNNER_TEMP/dottie-signing.keychain-db"
          keychain_password="$(openssl rand -hex 16)"
          echo "$SIGNING_P12" | base64 --decode > "$RUNNER_TEMP/dottie-signing.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/dottie-signing.p12" -k "$keychain" -P "$SIGNING_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/dottie-signing.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # A self-signed certificate has to be trusted for code signing.
          security find-certificate -c "Dottie Self-Signed Code Signing" -p "$keychain" > "$RUNNER_TEMP/dottie-signing.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/dottie-signing.pem"
          identity="$(security find-identity -v -p codesigning "$keychain" | awk '/Dottie Self-Signed/ {print $2; exit}')"
          if [ -z "$identity" ]; then
            security find-identity -p codesigning "$keychain"
            echo "::error::The signing certificate isn't usable for code signing."
            exit 1
          fi
          # Inside out: helper executables, then nested bundles, then the app.
          # Nested code keeps its own entitlements.
          find "$app/Contents" \( -path "*/Helpers/*" -o -path "*/Frameworks/*" \) -type f -perm -u+x | while read -r nested; do
            codesign --force --sign "$identity" --keychain "$keychain" --preserve-metadata=entitlements,flags "$nested"
          done
          find "$app/Contents" -depth \( -name "*.framework" -o -name "*.xpc" -o -name "*.app" \) | while read -r bundle; do
            codesign --force --sign "$identity" --keychain "$keychain" --preserve-metadata=entitlements,flags "$bundle"
          done
          codesign --force --sign "$identity" --keychain "$keychain" \
            --entitlements leanring-buddy/leanring-buddy.entitlements "$app"
          # The designated requirement is what macOS remembers permissions by.
          # It must name the certificate; a cdhash one changes every build.
          designated_requirement="$(codesign -d -r- "$app" 2>&1)"
          echo "$designated_requirement"
          security delete-keychain "$keychain"
          if echo "$designated_requirement" | grep -q "cdhash"; then
            echo "::error::The app's designated requirement is a cdhash, so permissions would reset on every update."
            exit 1
          fi

      - name: Check the app
        run: |
          app=build/Build/Products/Release/Dottie.app
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :ClickyWorkerBaseURL" "$app/Contents/Info.plist"
          lipo -archs "$app/Contents/MacOS/Dottie"
          test -x "$app/Contents/Helpers/cua-driver"
          test -f "$app/Contents/Frameworks/libneedle3.dylib"
          test -f "$app/Contents/Resources/Needle/needle3.cact"
          test -f "$app/Contents/Resources/Needle/whistle.cact"
          codesign --verify --deep --strict --verbose=2 "$app"

      - name: Make Dottie.dmg
        run: |
          mkdir -p dmg
          ditto build/Build/Products/Release/Dottie.app dmg/Dottie.app
          ln -s /Applications dmg/Applications
          hdiutil create -volname Dottie -srcfolder dmg -ov -format UDZO Dottie.dmg
          shasum -a 256 Dottie.dmg | tee Dottie.dmg.sha256

      - name: Keep the DMG for the next jobs
        # On a pull request this is the trial DMG to download and try.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ github.event_name == 'pull_request' && 'Dottie-trial-dmg' || 'Dottie-dmg' }}
          path: |
            Dottie.dmg
            Dottie.dmg.sha256
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-build-log
          path: build.log

  deploy-worker:
    # After the app built, so a release that can't build never changes the
    # Worker everyone is already using.
    needs: [prepare, build-dmg]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_DEPLOY_SECRETS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.GEMINI_API_KEY != '' }}
      WORKER_URL: ${{ needs.prepare.outputs.worker_url }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Only needed when the token can reach more than one account.
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Deploy the Worker
        id: deploy
        if: env.HAS_DEPLOY_SECRETS == 'true'
        working-directory: worker
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APP_SHARED_SECRET: ${{ secrets.DOTTIE_APP_SECRET }}
          # Optional free key from build.nvidia.com: NVIDIA models answer
          # when every Gemini model is busy.
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          # Optional free key from console.groq.com: quick asks and live
          # meeting help answer on Groq first.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Optional: Dottie's own Telegram bot, so people pair their phone
          # in one tap (Home → Phone) instead of making a bot themselves.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          npm ci
          # The code and its secrets go live together as one version, so
          # going back means one step. Secrets left empty are not sent, and
          # ones set on the Worker before stay as they are.
          secrets_file="$RUNNER_TEMP/worker-secrets.json"
          jq -n '
            {
              GEMINI_API_KEY: env.GEMINI_API_KEY,
              APP_SHARED_SECRET: env.APP_SHARED_SECRET,
              NVIDIA_API_KEY: env.NVIDIA_API_KEY,
              GROQ_API_KEY: env.GROQ_API_KEY,
              TELEGRAM_BOT_TOKEN: env.TELEGRAM_BOT_TOKEN
            } | with_entries(select(.value != null and .value != ""))
          ' > "$secrets_file"
          npx wrangler deploy --secrets-file "$secrets_file" 2>&1 | tee deploy.log
          rm -f "$secrets_file"
          deployed_url="$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' deploy.log | head -1)"
          echo "Deployed: $deployed_url"
          if [ -n "$deployed_url" ] && [ -n "$WORKER_URL" ] && [ "${WORKER_URL#https://}" != "${deployed_url#https://}" ] && [[ "$WORKER_URL" == *.workers.dev ]]; then
            echo "::warning::The app was built for $WORKER_URL but the Worker was deployed to $deployed_url."
          fi

      - name: Try the new Worker
        # The same calls the app makes first. If the new Worker doesn't
        # answer them, the one before is put back and the release stops
        # before anything is published.
        id: smoke
        if: steps.deploy.outcome == 'success' && env.WORKER_URL != ''
        env:
          APP_SHARED_SECRET: ${{ secrets.DOTTIE_APP_SECRET }}
        run: |
          try_worker() {
            health="$(curl -fsS --max-time 20 "$WORKER_URL/health")" || return 1
            echo "$health" | jq -e '.ok == true and .hasGeminiKey == true' >/dev/null || { echo "Unexpected /health: $health"; return 1; }
            configuration="$(curl -fsS --max-time 20 -H "x-clicky-secret: $APP_SHARED_SECRET" "$WORKER_URL/config")" || return 1
            echo "$configuration" | jq -e '.liveModel != null and .chatModel != null' >/dev/null || { echo "Unexpected /config: $configuration"; return 1; }
            # A request without the secret must be turned away when one is set.
            if [ -n "$APP_SHARED_SECRET" ]; then
              status_without_secret="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$WORKER_URL/config")"
              [ "$status_without_secret" = "401" ] || { echo "/config answered $status_without_secret without the secret"; return 1; }
            fi
          }
          # A new version takes a few seconds to reach every Cloudflare edge.
          for attempt in 1 2 3 4 5 6; do
            if try_worker; then
              echo "The new Worker answers at $WORKER_URL."
              exit 0
            fi
            sleep 10
          done
          echo "::error::The new Worker at $WORKER_URL doesn't answer properly."
          exit 1

      - name: Go back to the Worker before
        if: failure() && steps.smoke.outcome == 'failure'
        working-directory: worker
        run: |
          npx wrangler rollback --yes --message "Release $GITHUB_RUN_NUMBER: the new version failed its checks" \
            || echo "::error::Couldn't go back automatically. In the Cloudflare dashboard open Workers → dottie → Deployments and roll back by hand."

  publish:
    needs: [prepare, build-dmg, deploy-worker]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASES_REPOSITORY: ${{ vars.DOTTIE_RELEASES_REPOSITORY || github.repository }}
    steps:
      - name: Get the DMG
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Dottie-dmg

      - name: Check the DMG arrived whole
        run: shasum -a 256 -c Dottie.dmg.sha256

      - name: Publish the release
        env:
          RELEASES_TOKEN: ${{ secrets.DOTTIE_RELEASES_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if [ "$RELEASES_REPOSITORY" = "$GITHUB_REPOSITORY" ]; then
            export GH_TOKEN="${{ github.token }}"
            # The tag points at the commit that was built.
            target_arguments=(--target "$GITHUB_SHA")
          else
            if [ -z "$RELEASES_TOKEN" ]; then
              echo "::error::DOTTIE_RELEASES_REPOSITORY is $RELEASES_REPOSITORY, but the DOTTIE_RELEASES_TOKEN secret is missing, so the release can't be published there."
              exit 1
            fi
            export GH_TOKEN="$RELEASES_TOKEN"
            # This commit isn't in the releases repository: tag its newest commit.
            target_arguments=()
          fi
          # The install steps are in the notes themselves, since this
          # repository's INSTALL.md may be private.
          cat > notes.md <<EOF
          **Download [Dottie.dmg](https://github.com/${RELEASES_REPOSITORY}/releases/download/v${VERSION}/Dottie.dmg)**, open it and drag Dottie into Applications.

          The first time you open it, macOS says it can't check the app for malware. Click **Done**, open **System Settings → Privacy & Security**, scroll down and click **Open Anyway**, then enter your password and click **Open**. You only do this once.

          Already have Dottie? Update from **Home → Settings → Updates**.
          EOF
          publish_release() {
            local repository="$1"
            shift
            if gh release view "v$VERSION" --repo "$repository" >/dev/null 2>&1; then
              gh release upload "v$VERSION" Dottie.dmg Dottie.dmg.sha256 --clobber --repo "$repository"
            else
              gh release create "v$VERSION" Dottie.dmg Dottie.dmg.sha256 \
                --repo "$repository" \
                --title "Dottie $VERSION" \
                --notes-file notes.md \
                "$@"
            fi
          }
          publish_release "$RELEASES_REPOSITORY" "${target_arguments[@]}"
          # Copies of Dottie from before the releases repository look for
          # updates here, so the release goes here too: they find it while
          # this repository is public, and the update moves them over.
          if [ "$RELEASES_REPOSITORY" != "$GITHUB_REPOSITORY" ]; then
            GH_TOKEN="${{ github.token }}" publish_release "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
          fi

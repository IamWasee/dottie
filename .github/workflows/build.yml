name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-macos:
    # Compile check only: no signing, no running. The app needs a real Mac
    # with Microphone, Screen Recording and Accessibility permissions to run.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Pick Xcode
        # The newest Xcode 26 on the runner, so Dottie can use Apple's
        # on-device model on Macs that have it. Falls back to the default.
        run: |
          xcode="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' | sort -V | tail -1)"
          if [ -n "$xcode" ]; then
            sudo xcode-select -s "$xcode/Contents/Developer"
          else
            echo "::warning::No Xcode 26 on this runner: building with the default Xcode."
          fi
          xcodebuild -version

      - name: Show Xcode
        run: |
          xcodebuild -version
          xcodebuild -list -project leanring-buddy.xcodeproj

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project leanring-buddy.xcodeproj \
            -scheme leanring-buddy \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee build.log | grep -E "error:|warning: .*(concurrency|Sendable|actor)|BUILD (SUCCEEDED|FAILED)|cua-driver|Permission denied|Command .* failed" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Check the bundled cua-driver
        run: |
          grep -E "Bundled cua-driver|cua-driver not bundled" build.log || true
          app_path="$(find ~/Library/Developer/Xcode/DerivedData -maxdepth 5 -type d -name Dottie.app -path '*/Build/Products/Debug/*' | head -1)"
          echo "App: $app_path"
          test -x "$app_path/Contents/Helpers/cua-driver"
          file "$app_path/Contents/Helpers/cua-driver"
          "$app_path/Contents/Helpers/cua-driver" --version || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

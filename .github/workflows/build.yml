name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request replaces the run before it. Runs on
# main always finish, because a release waits for this commit's result.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-macos:
    # Builds the app without signing and runs the unit tests. The app itself
    # is never used here: it needs a real Mac with Microphone, Screen
    # Recording and Accessibility permissions, so the tests only host it.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Pick Xcode
        # The newest Xcode 26 on the runner, so Dottie can use Apple's
        # on-device model on Macs that have it. Falls back to the default.
        # The build keeps Xcode 16's concurrency rules (the two SWIFT_
        # settings below), which the project has always been built with.
        run: |
          xcode="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' | sort -V | tail -1)"
          if [ -n "$xcode" ]; then
            sudo xcode-select -s "$xcode/Contents/Developer"
          else
            echo "::warning::No Xcode 26 on this runner: building with the default Xcode."
          fi
          xcodebuild -version

      - name: Show Xcode
        run: |
          xcodebuild -version
          xcodebuild -list -project leanring-buddy.xcodeproj

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project leanring-buddy.xcodeproj \
            -scheme leanring-buddy \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SWIFT_DEFAULT_ACTOR_ISOLATION=nonisolated \
            SWIFT_APPROACHABLE_CONCURRENCY=NO \
            2>&1 | tee build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)|cua-driver|Permission denied|Command .* failed" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Compiler warnings
        # The build prints only errors so they are easy to find; this counts
        # the warnings so new ones can't slip in unseen. The full text is in
        # the uploaded build log.
        run: |
          grep -E "\.swift:[0-9]+:[0-9]+: warning: " build.log | sort -u > compiler-warnings.txt || true
          warning_count="$(wc -l < compiler-warnings.txt | tr -d ' ')"
          echo "Most common warnings:"
          sed -E 's/^.*: warning: //' compiler-warnings.txt | sort | uniq -c | sort -rn | head -15
          scripts/ci/check-budget.sh SWIFT_COMPILER_WARNING_BUDGET "$warning_count" "different compiler warnings"

      - name: Check the bundled cua-driver
        run: |
          grep -E "Bundled cua-driver|cua-driver not bundled" build.log || true
          app_path="$(find ~/Library/Developer/Xcode/DerivedData -maxdepth 5 -type d -name Dottie.app -path '*/Build/Products/Debug/*' | head -1)"
          echo "App: $app_path"
          test -x "$app_path/Contents/Helpers/cua-driver"
          file "$app_path/Contents/Helpers/cua-driver"
          "$app_path/Contents/Helpers/cua-driver" --version || true

      - name: Check the bundled Needle
        # embed-needle.sh only warns when a download fails (so offline
        # builds work), so CI is where a missing Needle gets caught.
        run: |
          grep -E "Needle" build.log | grep -v "^\s*$" | head -5 || true
          app_path="$(find ~/Library/Developer/Xcode/DerivedData -maxdepth 5 -type d -name Dottie.app -path '*/Build/Products/Debug/*' | head -1)"
          test -f "$app_path/Contents/Frameworks/libneedle3.dylib"
          test -f "$app_path/Contents/Resources/Needle/needle3.cact"
          test -f "$app_path/Contents/Resources/Needle/whistle.cact"
          lipo -archs "$app_path/Contents/Frameworks/libneedle3.dylib"

      - name: Run the unit tests
        # Dottie hosts the tests but starts nothing (see isHostingUnitTests in
        # leanring_buddyApp.swift), so no permission is needed on the runner.
        timeout-minutes: 15
        run: |
          set -o pipefail
          xcodebuild test \
            -project leanring-buddy.xcodeproj \
            -scheme leanring-buddy \
            -configuration Debug \
            -destination 'platform=macOS' \
            -resultBundlePath test-results.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SWIFT_DEFAULT_ACTOR_ISOLATION=nonisolated \
            SWIFT_APPROACHABLE_CONCURRENCY=NO \
            2>&1 | tee test.log | grep -E "error:|Test (Suite|Case|run)|✔|✘|◇ Test run|passed|failed|TEST (SUCCEEDED|FAILED)|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "TEST SUCCEEDED" test.log

      - name: Test summary
        if: always()
        run: |
          if [ -f test.log ]; then
            {
              echo "### App unit tests"
              echo ""
              echo "- $(grep -cE "^Test case .* passed" test.log) passed, $(grep -cE "^Test case .* failed" test.log) failed"
              grep -E "^Test case .* failed" test.log | sed 's/^/- /' || true
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-log
          path: |
            build.log
            test.log
            compiler-warnings.txt
            test-results.xcresult

  lint-swift:
    # SwiftLint with the rules in .swiftlint.yml. The number of findings may
    # not go over the ceiling in scripts/ci/budgets.env.
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Find SwiftLint
        run: |
          if ! command -v swiftlint >/dev/null; then
            brew install swiftlint
          fi
          swiftlint version

      - name: Lint
        run: |
          swiftlint lint --quiet --reporter json > swiftlint-findings.json || true
          finding_count="$(jq length swiftlint-findings.json)"
          echo "Findings by rule:"
          jq -r '.[].rule_id' swiftlint-findings.json | sort | uniq -c | sort -rn
          scripts/ci/check-budget.sh SWIFTLINT_FINDING_BUDGET "$finding_count" "SwiftLint findings"

      - name: Upload the findings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: swiftlint-findings
          path: swiftlint-findings.json

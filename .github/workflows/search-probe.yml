name: Search probe
on:
  push:
    branches: [claude/project-thread-gqnwg6]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the app's web search code on Linux
        run: |
          swift --version
          swiftc -o search-probe leanring-buddy/DottieWebSearch.swift scripts/search-probe/Stubs.swift scripts/search-probe/main.swift 2>&1 | tail -20 || true
          ls search-probe && ./search-probe

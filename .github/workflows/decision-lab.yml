name: Decision lab

# Times small (under 1B) Jev-style decision models on Dottie's screen-job
# steps (scripts/decision-lab/cases.json) on a Mac runner: right answers,
# confidence, milliseconds per answer and peak memory. Each model runs in its
# own job; the summary is the RESULT_JSON line in each job's log.
on:
  push:
    branches: [claude/project-thread-ntbwt4]
    paths: ["scripts/decision-lab/**", ".github/workflows/decision-lab.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lab:
    runs-on: macos-15
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        model: [laya, laya-typed, bosun, kev, tev1]
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      DO_NOT_TRACK: "1"
      DECISION_LAB_OUTPUT: ${{ runner.temp }}/result.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Machine
        run: |
          sysctl -n machdep.cpu.brand_string hw.memsize hw.ncpu
          sw_vers

      - name: Set up Laya
        if: startsWith(matrix.model, 'laya')
        run: python -m pip install laya

      - name: Set up Bosun
        if: matrix.model == 'bosun'
        run: python -m pip install torch transformers peft safetensors accelerate

      - name: Set up and start Kev 0.8B
        if: matrix.model == 'kev'
        run: |
          python -m pip install uv
          git clone --depth 1 https://github.com/jaredpalmer/kev.git "$RUNNER_TEMP/kev"
          cd "$RUNNER_TEMP/kev"
          uv sync --extra serve
          nohup uv run --extra serve python -m kev.serve --run jaredpalmer/kev-0.8b --port 8009 > "$RUNNER_TEMP/server.log" 2>&1 &
          for attempt in $(seq 1 180); do
            if curl -s -o /dev/null --max-time 2 http://127.0.0.1:8009/; then echo "Kev is up after ~$((attempt * 5)) s"; break; fi
            sleep 5
          done
          tail -n 40 "$RUNNER_TEMP/server.log"

      - name: Set up and start Ollama with Tev1 0.8B
        if: matrix.model == 'tev1'
        run: |
          brew install ollama
          ollama --version
          nohup ollama serve > "$RUNNER_TEMP/server.log" 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -s -o /dev/null --max-time 2 http://127.0.0.1:11434/; then break; fi
            sleep 2
          done
          ollama pull tev1:0.8b
          ollama list

      - name: Run the cases
        run: python scripts/decision-lab/run.py "${{ matrix.model }}" scripts/decision-lab/cases.json

      - name: Server log
        if: always() && (matrix.model == 'kev' || matrix.model == 'tev1')
        run: tail -n 80 "$RUNNER_TEMP/server.log" || true

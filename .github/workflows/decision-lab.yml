name: Decision lab

# Times Jev-style decision models on Dottie's screen-job
# steps (scripts/decision-lab/cases.json) on a Mac runner: right answers,
# confidence, milliseconds per answer and peak memory. Each model runs in its
# own job; the summary is the RESULT_JSON line in each job's log.
on:
  push:
    branches: [claude/project-thread-ntbwt4]
    paths: ["scripts/decision-lab/**", ".github/workflows/decision-lab.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lab:
    runs-on: macos-15
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # Every model run.py knows: laya, laya-typed, bosun, kev, tev1, kev4b, kev4b-q4, clef-flash.
        # The runner has 7 GB of memory, so the bigger ones run quantized (kev4b full size is tried anyway).
        model: [clef-flash]
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Machine
        run: |
          sysctl -n machdep.cpu.brand_string hw.memsize hw.ncpu
          sw_vers

      - name: Set up Laya
        if: startsWith(matrix.model, 'laya')
        run: python -m pip install laya

      - name: Set up Bosun
        if: matrix.model == 'bosun'
        run: python -m pip install torch transformers peft safetensors accelerate

      - name: Set up and start Kev
        if: matrix.model == 'kev' || matrix.model == 'kev4b'
        env:
          KEV_CHECKPOINT: ${{ matrix.model == 'kev4b' && 'jaredpalmer/kev-4b' || 'jaredpalmer/kev-0.8b' }}
        run: |
          python -m pip install uv
          git clone --depth 1 https://github.com/jaredpalmer/kev.git "$RUNNER_TEMP/kev"
          cd "$RUNNER_TEMP/kev"
          uv sync --extra serve
          nohup uv run --extra serve python -m kev.serve --run "$KEV_CHECKPOINT" --port 8009 > "$RUNNER_TEMP/server.log" 2>&1 &
          for attempt in $(seq 1 180); do
            if curl -s -o /dev/null --max-time 2 http://127.0.0.1:8009/; then echo "Kev is up after ~$((attempt * 5)) s"; break; fi
            if ! pgrep -f kev.serve > /dev/null; then echo "Kev's server stopped"; break; fi
            sleep 5
          done
          tail -n 40 "$RUNNER_TEMP/server.log"

      - name: Set up and start Ollama
        if: matrix.model == 'tev1' || matrix.model == 'kev4b-q4'
        env:
          OLLAMA_MODEL: ${{ matrix.model == 'kev4b-q4' && 'turintech/kev-4b-artemis:2.0gb' || 'tev1:0.8b' }}
        run: |
          # Decision models need Ollama 0.35 or newer; Homebrew lags behind.
          curl -fsSL -o "$RUNNER_TEMP/ollama.tgz" https://github.com/ollama/ollama/releases/latest/download/ollama-darwin.tgz
          mkdir -p "$RUNNER_TEMP/ollama" && tar -xzf "$RUNNER_TEMP/ollama.tgz" -C "$RUNNER_TEMP/ollama"
          export PATH="$RUNNER_TEMP/ollama:$PATH" && echo "$RUNNER_TEMP/ollama" >> "$GITHUB_PATH"
          ls "$RUNNER_TEMP/ollama"
          ollama --version
          nohup ollama serve > "$RUNNER_TEMP/server.log" 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -s -o /dev/null --max-time 2 http://127.0.0.1:11434/; then break; fi
            sleep 2
          done
          ollama pull "$OLLAMA_MODEL"
          ollama list

      - name: Set up and start Clef-Flash 9B (Q4_0) on llama.cpp
        if: matrix.model == 'clef-flash'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Clef needs llama.cpp b11430 or newer (the GGUF was made with it).
          # The latest release's Mac build, else known builds by name.
          curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" https://api.github.com/repos/ggml-org/llama.cpp/releases/latest > "$RUNNER_TEMP/release.json"
          llama_url=$(python -c 'import json,sys; assets=json.load(open(sys.argv[1]))["assets"]; print(next((a["browser_download_url"] for a in assets if "macos-arm64" in a["name"] and a["name"].endswith((".tar.gz", ".zip"))), ""))' "$RUNNER_TEMP/release.json")
          if [ -z "$llama_url" ]; then
            python -c 'import json,sys; d=json.load(open(sys.argv[1])); print(d.get("tag_name"), [a["name"] for a in d["assets"]])' "$RUNNER_TEMP/release.json"
            for build in b11430 b11379; do
              candidate="https://github.com/ggml-org/llama.cpp/releases/download/$build/llama-$build-bin-macos-arm64.tar.gz"
              if curl -fsIL -o /dev/null "$candidate"; then llama_url="$candidate"; break; fi
            done
          fi
          echo "$llama_url"
          curl -fsSL -o "$RUNNER_TEMP/llama-download" "$llama_url"
          mkdir -p "$RUNNER_TEMP/llama"
          case "$llama_url" in
            *.zip) unzip -q "$RUNNER_TEMP/llama-download" -d "$RUNNER_TEMP/llama" ;;
            *) tar -xzf "$RUNNER_TEMP/llama-download" -C "$RUNNER_TEMP/llama" ;;
          esac
          llama_server=$(find "$RUNNER_TEMP/llama" -name llama-server -type f | head -n 1)
          "$llama_server" --version || true
          # Q4_0 (5.6 GB): the largest 4-bit file that leaves the 7 GB runner some room. The decision head stays Q8_0.
          curl -fsSL -o "$RUNNER_TEMP/clef-flash.gguf" https://huggingface.co/bartowski/Cloudflare_clef-flash-GGUF/resolve/main/Cloudflare_clef-flash-Q4_0.gguf
          start_server() {
            nohup "$llama_server" -m "$RUNNER_TEMP/clef-flash.gguf" --host 127.0.0.1 --port 8097 \
              --ctx-size 2048 --batch-size 2048 --ubatch-size 2048 --parallel 1 --no-webui --no-warmup -ngl "$1" \
              > "$RUNNER_TEMP/server.log" 2>&1 &
            for attempt in $(seq 1 120); do
              if curl -sf -o /dev/null --max-time 2 http://127.0.0.1:8097/health; then echo "Clef-Flash is up with -ngl $1"; return 0; fi
              if ! pgrep -f llama-server > /dev/null; then break; fi
              sleep 2
            done
            tail -n 40 "$RUNNER_TEMP/server.log"
            pkill -INT -f llama-server || true
            sleep 5
            return 1
          }
          # CPU only: on the GPU it loads past macOS's recommended memory and crashes on its first answer.
          start_server 0
          tail -n 25 "$RUNNER_TEMP/server.log"

      - name: Run the cases
        run: python scripts/decision-lab/run.py "${{ matrix.model }}" scripts/decision-lab/cases.json

      - name: Server log
        if: always() && !startsWith(matrix.model, 'laya') && matrix.model != 'bosun'
        run: tail -n 80 "$RUNNER_TEMP/server.log" || true

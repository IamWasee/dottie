<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
<defs>
  <linearGradient id="scales" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#6EE7B7"/><stop offset="0.5" stop-color="#10B981"/><stop offset="1" stop-color="#065F46"/>
  </linearGradient>
  <linearGradient id="horn" x1="0" y1="1" x2="0" y2="0">
    <stop offset="0" stop-color="#D6C7A1"/><stop offset="1" stop-color="#FFFBEB"/>
  </linearGradient>
  <linearGradient id="crown" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFF1B8"/><stop offset="1" stop-color="#F59E0B"/>
  </linearGradient>
</defs>
<!-- horns sweep back -->
<path d="M20 25 C 14 20 9 16 4 15 C 9 20 12 25 15 30 Z" fill="url(#horn)"/>
<path d="M27 22 C 23 15 19 11 13 9 C 17 15 19 21 21 27 Z" fill="url(#horn)"/>
<!-- mane spikes -->
<path d="M13 32 L 4 30 L 10 37 L 3 40 L 12 43 L 7 49 L 17 47 Z" fill="#047857"/>
<!-- head and snout, facing right -->
<path d="M14 38 C 13 28 20 21 30 21 C 36 21 41 23 47 26 L 56 30 C 60 32 60 37 56 38.5 L 46 40 C 43 41 41 43 40 46 L 34 51 C 30 54 24 54 20 51 C 16 48 14 43 14 38 Z" fill="url(#scales)"/>
<!-- jaw line and nostril -->
<path d="M57 38 L 44 41 C 41 42 39 44 37 47" fill="none" stroke="#064E3B" stroke-width="1.6" stroke-linecap="round"/>
<ellipse cx="54" cy="32" rx="1.4" ry="1" fill="#064E3B"/>
<!-- brow ridge and eye -->
<path d="M30 27 C 34 25 38 25 41 27" fill="none" stroke="#065F46" stroke-width="2" stroke-linecap="round"/>
<path d="M32 31 C 34 28.8 38 28.8 40 31 C 38 33 34 33 32 31 Z" fill="#FDE047"/>
<ellipse cx="36" cy="31" rx="0.9" ry="1.9" fill="#1F2937"/>
<!-- tooth -->
<path d="M47 40 L 48.5 44 L 50 39.6 Z" fill="#FFFFFF"/>
<!-- crown -->
<path d="M24 16 L 25 6 L 29.5 11 L 33 4 L 36.5 11 L 41 6 L 42 16 Z" fill="url(#crown)"/>
<rect x="24" y="15" width="18" height="3.4" rx="1.2" fill="#D97706"/>
<circle cx="33" cy="11.5" r="1.6" fill="#F472B6"/>
</svg>
